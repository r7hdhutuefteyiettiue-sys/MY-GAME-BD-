<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{if(localStorage.getItem("mgbd_theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<title>My Game BD</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Game BD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1512;--panel:#12241E;--line:#1F3A31;--tx:#EAF3EE;--mut:#8FA89D;--red:#F23D4B;--gold:#F5B83D;--grn:#1FBF7A;--navbg:#0A1512f2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
h1,h2,h3,.num{font-family:'Rajdhani','Hind Siliguri',sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
.logo{font-family:Rajdhani;font-weight:700;font-size:44px;letter-spacing:1px}
.logo b{color:var(--red)}
.bar{width:150px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));animation:ld 1.6s forwards}
@keyframes ld{to{width:100%}}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header .logo{font-size:24px}
.bell{position:relative;width:40px;height:40px;border-radius:12px;background:var(--panel);font-size:18px}
.bell s{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);text-decoration:none}
.slider{margin:14px 16px;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/9;background:var(--panel)}
.slides{display:flex;position:absolute;inset:0;transition:transform .6s}
.slide{min-width:100%;padding:20px;display:flex;flex-direction:column;justify-content:flex-end}
.slide{position:relative}.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.slide h2,.slide p{position:relative}
.slide h2{font-size:26px;line-height:1.1}.slide p{color:#ffffffcc;font-size:14px}
.slide[data-v]{cursor:pointer}
.play{position:absolute;top:14px;right:14px;background:#000a;border-radius:20px;padding:4px 12px;font-size:13px;z-index:2}
.dots{position:absolute;bottom:10px;right:14px;display:flex;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff6}.dots i.on{background:#fff;width:16px;border-radius:4px}
.join-txt{padding:4px 16px 10px;font-weight:600}
.join-txt span{display:block;color:var(--mut);font-weight:400;font-size:13px}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.soc button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-weight:600;font-size:14px}
.soc button b{display:block;font-size:20px}
.ico svg{display:block;width:32px;height:32px;margin:0 auto 6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:22px 16px 10px}
.sec h2{font-size:22px}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.chips button{white-space:nowrap;padding:6px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chips button.on{background:var(--red);border-color:var(--red)}
.card{margin:0 16px 16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.thumb{height:140px;position:relative;display:flex;align-items:flex-end;padding:12px;background-size:cover;background-position:center}
.tag{position:absolute;top:10px;left:10px;background:var(--red);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:600}
.tm{position:absolute;top:10px;right:10px;background:#000b;border-radius:8px;padding:2px 10px;font-size:12px}
.thumb h3{font-size:24px;text-shadow:0 2px 8px #000}
.mimg{display:block;width:100%;height:auto;background:var(--line)}
.mph{height:96px;display:flex;align-items:center;justify-content:center;padding:0 12px;text-align:center;font:700 26px Rajdhani,sans-serif;letter-spacing:1px}
.mi{padding:12px 14px 0}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mtag{background:var(--red);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:600}
.mtm{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:12px;color:var(--mut)}
.mi h3{font-size:22px;line-height:1.25}
.bh{display:flex;gap:12px;align-items:flex-start;padding:14px}
.bimg{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none;background:var(--line)}
.bph{display:flex;align-items:center;justify-content:center;font:700 26px Rajdhani,sans-serif;color:#fff}
.bt{flex:1;min-width:0}.bt h3{font-size:20px;line-height:1.25}
.btm{margin-top:4px;font-weight:700;color:var(--gold);font-size:16px}
.bs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 12px}
.bs div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
.bs span{display:block;font-size:12px;color:var(--mut)}
.bs b{display:block;font:700 20px Rajdhani,sans-serif;margin-top:2px}
.pimg{display:block;width:100%;border-radius:14px;margin-bottom:12px}
.rimg{display:block;width:100%;border-radius:12px;margin:8px 0;cursor:zoom-in}
.vid{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;margin:8px 0;position:relative;background:#000;object-fit:cover}
.vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;text-shadow:0 2px 12px #000}
.vlink{width:100%;margin:8px 0}
.sw{display:block;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--grn)}.sw.on::after{left:21px}
.slide{color:#fff}
.b.pri,.tabs button.on,.chips button.on,.mtag,.mph,.play{color:#fff}
:root[data-theme=light]{--bg:#F2F6F4;--panel:#FFFFFF;--line:#D7E2DC;--tx:#10201A;--mut:#5C7268;--gold:#B87800;--grn:#12945A;--navbg:#FFFFFFF2;color-scheme:light}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 8px;text-align:center}
.stats div{font-size:12px;color:var(--mut)}.stats b{display:block;font-size:20px;color:var(--tx);font-family:Rajdhani}
.stats .pz{color:var(--gold)}
.slots{margin:0 14px 12px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}.slots i{display:block;height:100%;background:var(--grn)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.b{padding:11px;border-radius:12px;font-weight:700;text-align:center}
.b.ghost{border:1px solid var(--line);background:#0000}.b.pri{background:var(--red)}.b.dis{background:var(--line);color:var(--mut)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--navbg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 0}
nav button span{font-size:20px}nav button.on{color:var(--gold)}
.back{padding:14px 16px;font-weight:600;color:var(--gold)}
.tabs{display:flex;margin:0 16px;background:var(--panel);border-radius:12px;padding:4px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:14px}.tabs button.on{background:var(--red)}
.box{margin:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;line-height:1.6}
.box h3{margin-bottom:6px;font-size:18px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:center}th{color:var(--mut);font-weight:500}td:nth-child(2){text-align:left}tr+tr{border-top:1px solid var(--line)}
.room{background:var(--bg);border:1px dashed var(--gold);border-radius:10px;padding:10px;text-align:center;font-family:Rajdhani;font-size:20px;letter-spacing:1px}
.modal{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h3{font-size:22px;margin-bottom:10px}
select,input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--tx);font:inherit;margin-bottom:8px}
.pop{text-align:center}.pop .big{height:120px;border-radius:14px;margin-bottom:12px;background:linear-gradient(135deg,#F23D4B,#F5B83D);display:flex;align-items:center;justify-content:center;font-family:Rajdhani;font-size:32px;font-weight:700;color:#1a0a0a}
.pop p{white-space:pre-line;text-align:left}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--grn);color:#02150c;padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;display:none;max-width:90%;text-align:center}
.prof{display:flex;gap:14px;align-items:center;padding:16px}.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--gold));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#1a0a0a}
.list button{display:flex;justify-content:space-between;width:100%;padding:14px;border-bottom:1px solid var(--line);font-size:16px}
.lg{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px;color:var(--mut);cursor:pointer}.lg img{display:none;width:44px;height:44px;border-radius:10px;object-fit:cover}
.opt{margin:0 16px 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.opt>button{display:flex;justify-content:space-between;width:100%;padding:15px 14px;font-weight:600;font-size:16px}
.ob{padding:2px 14px 14px;font-size:15px;line-height:1.6}
.sq{padding:10px 0;border-bottom:1px solid var(--line)}.sq:last-child{border:0}
.sqh{display:flex;align-items:center;gap:10px;margin-bottom:6px}.sqh img,.sqh i{width:34px;height:34px;border-radius:9px;object-fit:cover;background:var(--red);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.pls{display:flex;flex-wrap:wrap;gap:6px}.pls span{background:var(--bg);border-radius:8px;padding:2px 10px;font-size:13px;color:var(--mut)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}.tc{text-align:center;font-size:13px}.tc img,.tc i{width:56px;height:56px;border-radius:14px;margin:0 auto 4px;object-fit:cover;background:var(--red);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:22px}
.hero{margin:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-align:center;padding-bottom:16px}
.ban{height:84px;background:linear-gradient(120deg,#7a0f1c,#F23D4B 55%,#F5B83D)}
.avw{margin-top:-44px}.av2{width:88px;height:88px;border-radius:50%;margin:0 auto;border:4px solid var(--gold);background:var(--bg);display:flex;align-items:center;justify-content:center;font:700 36px Rajdhani;overflow:hidden}.av2 img{width:100%;height:100%;object-fit:cover}
.pn{font-size:26px;margin-top:8px}.chp{display:flex;gap:8px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}.chp span{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:13px;color:var(--mut)}
.ed{font-size:13px;color:var(--gold);padding:4px 10px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px 0}.st div{background:var(--bg);border-radius:14px;padding:10px;font-size:12px;color:var(--mut)}.st b{display:block;font:700 22px Rajdhani;color:var(--tx)}
.menu{margin:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px;text-align:left;font-size:16px;font-weight:600}.menu button+button{border-top:1px solid var(--line)}
.menu i{font-style:normal;width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px}
.menu span{flex:1}.menu small{display:block;font-weight:400;font-size:12px;color:var(--mut)}.menu em{font-style:normal;color:var(--mut);font-size:20px}
.auth{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;overflow:auto}.auth.on{display:block}
.aw{max-width:420px;margin:0 auto;padding:56px 20px 40px}.aw .logo{text-align:center;margin-bottom:6px}.aw .sub{text-align:center;color:var(--mut);margin-bottom:22px}
.aw .tabs{margin:0 0 16px}.amsg{min-height:22px;color:var(--red);font-size:14px;margin:4px 0 8px}.alink{display:block;margin:14px auto 0;color:var(--gold);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#inst{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 24px #0008}
#inst.on{display:flex}#inst span{flex:1;font-size:14px;font-weight:600}#inst .b{padding:8px 14px}#inst .x{padding:6px 10px;color:var(--mut)}

.rule{display:flex;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.65;font-size:15px}
.rule i{font-style:normal;color:#1E7BFF;font-weight:700;flex:none}
.rule.h{font-weight:700;font-size:16px;background:var(--panel)}
.rdv{height:1px;background:var(--line);margin:12px 0}
#pov{position:fixed;inset:0;background:#000c;z-index:44;display:flex;align-items:center;justify-content:center;padding:20px}
.pc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:24px;width:100%;max-width:380px;max-height:88vh;overflow:auto;padding:56px 16px 16px;box-shadow:0 10px 40px #000a}
.px{position:absolute;top:8px;right:8px;width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;font-size:20px;font-weight:700}
.pw{overflow:hidden;border-radius:16px}.pt{display:flex;transition:transform .35s}.pt img{min-width:100%;width:100%;display:block}
.pc h3{margin:12px 0 0;font-size:22px}.pc p{white-space:pre-line;color:var(--mut);margin:8px 0 12px;text-align:left;line-height:1.6}
.pc>.b{width:100%;margin-top:12px}
.pn2{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.pa{width:44px;height:44px;border-radius:50%;background:#1E7BFF;color:#fff;font-size:26px;line-height:1}
.pd{display:flex;gap:6px}.pd i{width:8px;height:8px;border-radius:50%;background:var(--line)}.pd i.on{width:24px;border-radius:5px;background:#1E7BFF}
.earn{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:14px 16px 0;padding:14px;border-radius:18px;background:linear-gradient(120deg,#1E7BFF,#7B3FF2 60%,#F23D4B);color:#fff;text-align:left;font-weight:700;font-size:17px}
.earn small{display:block;font-weight:500;font-size:12px;opacity:.92}.earn i{font-style:normal;font-size:28px}

.tcard{display:block;width:calc(100% - 32px);padding:0;text-align:left;color:inherit;box-shadow:0 6px 18px #0003;transition:transform .15s}
.tcard:active{transform:scale(.98)}
.tcard .mimg{width:100%}
.jn .b{padding:10px;font-size:15px;box-shadow:0 4px 14px #0004}
.jn .b.dis{box-shadow:none}
.cdb{padding:7px 10px;text-align:center;font-weight:700;font-size:13px;letter-spacing:.2px;background:linear-gradient(90deg,#0e8a57,#1FBF7A);color:#fff}
.cdb.go{background:linear-gradient(90deg,#b87800,#F5B83D);color:#241800}
.cdb.full{background:linear-gradient(90deg,#b8232f,#F23D4B);color:#fff}
.mq{overflow:hidden;white-space:nowrap;margin:0 0 12px;padding:2px 0}
.mqt{display:inline-block;will-change:transform}
.mqu{display:inline-block;font-weight:700;font-size:16px;color:var(--gold)}
.mqs{margin:0 18px;opacity:.7}
@keyframes mq{to{transform:translateX(-50%)}}

/* ===== ল্যাম্প লগইন ডিজাইন ===== */
.auth{background:radial-gradient(circle at 50% 18%,#1b1d20,#121417 70%)}
.lampw{padding-top:max(28px,env(safe-area-inset-top))}
.lamp{position:relative;width:200px;margin:0 auto;cursor:pointer;user-select:none}
.lamp svg{display:block;width:100%;height:auto;overflow:visible;position:relative}
.lglow{position:absolute;left:50%;top:-30px;width:340px;height:340px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,110,.35),transparent 68%);opacity:0;transition:opacity .5s;pointer-events:none}
.l-sh{fill:#e8e1d9;transition:fill .5s,filter .5s}.l-st{fill:#d1ccc2}
.l-cord{stroke:#8a8579;stroke-width:1.5}.l-knob{fill:#d4a373}
.lamp .cg{transition:transform .15s}.lamp.pull .cg{transform:translateY(14px)}
.lhint{text-align:center;color:#8a8579;font-size:13px;margin-top:2px;transition:opacity .4s}
.lampw.on .lglow{opacity:1}.lampw.on .l-sh{fill:#fffdf5;filter:drop-shadow(0 0 22px rgba(255,214,110,.75))}
.lampw.on .lhint{opacity:0}
.lcard{margin-top:14px;padding:22px 18px;border-radius:24px;background:linear-gradient(145deg,#ffffff1c,#ffffff0a);border:1px solid #ffffff1f;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .5s,transform .5s,visibility .5s}
.lampw.on .lcard{opacity:1;visibility:visible;transform:none}
.lcard .logo{font-size:34px;text-align:center;color:#fff}.lcard .sub{color:#b9b3a6;text-align:center;margin-bottom:18px}
.lcard input{background:#ffffff14;border-color:#ffffff22;color:#fff}
.lcard .tabs{background:#0006;margin:0 0 16px}.lcard .tabs button{color:#cfc9bb}.lcard .tabs button.on{background:#d4a373;color:#1a1208}
.lcard #a_go{background:linear-gradient(135deg,#b8892e,#f5d98a 50%,#b8892e);color:#1a1208;font-size:16px;box-shadow:0 6px 18px #d4a37355}

/* ===== প্রফেশনাল টাচ ঢেউ (রিপল) ===== */
.rp{overflow:hidden}
.rpw{position:absolute;z-index:3;border-radius:50%;pointer-events:none;background:currentColor;opacity:.3;transform:scale(0);animation:rpa .7s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes rpa{60%{opacity:.22}to{transform:scale(1);opacity:0}}
/* পেজ/ট্যাব বদলালে হালকা ঢেউয়ের মতো ফেড-ইন */
#app{animation:pgw .4s ease-out}
@keyframes pgw{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="auth" class="auth"></div>
<div id="splash"><div class="logo">MY GAME <b>BD</b></div><div class="bar"><i></i></div></div>
<header><div class="logo">MY GAME <b>BD</b></div><button class="bell" id="bell" aria-label="নোটিফিকেশন">🔔<s></s></button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

function earn(){return `<button class="back" data-n="profile">‹ ফিরে যান</button>

const joinBtn=(m,j)=>`<div class="jn" style="padding:0 14px 12px">${banMatch()?'<button class="b dis" style="width:100%">🚫 ব্যান থাকায় ম্যাচ খেলা বন্ধ</button>':j?'<button class="b dis" style="width:100%">✅ আপনি এই ম্যাচে আছেন</button>':(m.teams>=m.max||m.full?'<button class="b dis" style="width:100%">🔴 ম্যাচ ফুল</button>':`<button class="b pri" style="width:100%" data-l="telegram">জয়েন করতে টেলিগ্রামে মেসেজ দিন · ${m.fee?bd(m.fee):"ফ্রি"}</button><div style="color:var(--mut);font-size:13px;margin-top:6px;text-align:center">টেলিগ্রামে টাকা দিলে রেজিস্ট্রেশন ফর্ম পাবেন। ফর্ম পূরণের পর আপনার স্লট এখানে যোগ হবে।</div>`)}</div>`;

 if(!/^01\d{9}$/.test(num))return toast("সঠিক ১১ ডিজিটের নম্বর দিন");
 if(!LIVE)return;const b=$("#v_go");b.disabled=true;
 db.collection(C.vids).add({uid:S.user.uid,gameUid:S.prof.uid||"",name:S.prof.name||"",link,payMethod:m,payNumber:num,note,status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{toast("ভিডিও জমা হয়েছে, যাচাইয়ের পর যোগাযোগ করা হবে",3500);$("#v_link").value="";$("#v_note").value="";b.disabled=false}).catch(()=>{toast("জমা দেওয়া যায়নি, আবার চেষ্টা করুন");b.disabled=false})}

const bd=n=>"৳"+Number(n).toLocaleString("bn-BD");

const bd2=x=>String(x).replace(/\d/g,c=>"০১২৩৪৫৬৭৮৯"[c]),cdPad=n=>String(n).padStart(2,"0"),TK0=Date.now();
function cdState(m){
 const n=m.teams||0;
 if(m.full||(m.max&&n>=m.max))return["🔴 ম্যাচ ফুল","full"];
 if(!m.startAt)return null;
 const d=m.startAt-Date.now();
 if(d<=0)return["ম্যাচ শুরু হয়ে গেছে","go"];
 const s=Math.floor(d/1000),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),mi=Math.floor(s%3600/60),se=s%60;
 const t=dd?`${bd2(dd)}দিন ${bd2(h)}ঘ:${bd2(cdPad(mi))}মি`:(h?`${bd2(h)}ঘ:${bd2(cdPad(mi))}মি:${bd2(cdPad(se))}সে`:`${bd2(mi)}মি:${bd2(cdPad(se))}সে`);
 return["⏱ শুরু হতে বাকি - "+t,""]}

function tkHtml(){const st=RAW.st||{};if(st.tickerActive===false)return"";const a=(st.tickerTexts||[]).filter(Boolean);if(!a.length)return"";
 const sep='<span class="mqs">✦</span>',len=a.join("").length+a.length*4,n=Math.max(1,Math.ceil(70/len)),unit=Array(n).fill(a.map(escH).join(sep)+sep).join(""),
 sp=20+Math.min(10,Math.max(1,+st.tickerSpeed||5))*8,dur=Math.max(6,len*n*9/sp),ph=((Date.now()-TK0)/1000)%dur;
 return `<div class="mq"><div class="mqt" style="animation:mq ${dur.toFixed(2)}s linear -${ph.toFixed(2)}s infinite !important"><span class="mqu">${unit}</span><span class="mqu">${unit}</span></div></div>`}
const ytId=u=>{const m=String(u||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:""};

 if(/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(u)||u.startsWith("data:video"))return `<video class="vid" src="${u}" controls playsinline preload="metadata"></video>`;
 return `<button class="b pri vlink" data-u="${u}">▶ ভিডিও দেখুন</button>`}

const curTheme=()=>document.documentElement.dataset.theme==="light"?"light":"dark";
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("mgbd_theme",t)}catch(e){}}
const sndOn=()=>{try{return localStorage.getItem("mgbd_snd")!=="off"}catch(e){return true}};
const setSnd=v=>{try{localStorage.setItem("mgbd_snd",v?"on":"off")}catch(e){}};
function AC(){try{return window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)())}catch(e){return null}}
["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,()=>{const c=AC();if(c&&c.state==="suspended")c.resume()},{passive:true}));
function ding(){try{const c=AC();if(!c)return;if(c.state==="suspended")c.resume();const t=c.currentTime;
 [[880,0],[1318.5,.18]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.4,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.7);o.start(t+d);o.stop(t+d+.75)});
 if(navigator.vibrate)navigator.vibrate([120,80,120])}catch(e){}}
function alertSound(text){if(sndOn())ding();toast(text,4500)}

function toast(m,ms){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display="none",ms||2200)}

function closeModal(){$("#modal").classList.remove("on")}

 ${tkHtml()}<div class="join-txt">টেলিগ্রামে জয়েন হয়ে যাও<span>রুম আইডি, রেজাল্ট ও আপডেট সবার আগে পাবে</span></div>

<script>
function mgPlayers(t){const names=t.players||t.names||t.playerNames||[],uids=t.uids||[],n=Math.max(names.length,uids.length),out=[];
 for(let i=0;i<Math.min(n,5);i++){const p=names[i];const o=(p&&typeof p==="object")?{n:p.name||p.gameName||p.ign||"",u:p.uid||p.gameUid||p.id||uids[i]||""}:{n:p||"",u:uids[i]||""};if(o.n||o.u)out.push(o)}
 return out}
function reg(){
 const RL=MATCHES.filter(x=>!x.br),m=RL.find(x=>x.id==S.rm);
 const hero=`<div class="pg-hero"><h2>👥 টিম লিস্ট</h2><p>রেজিস্টার্ড টিম ও তাদের প্লেয়ারদের তালিকা</p></div>`;
 if(!m)return hero+`<div class="emp"><div class="em">🏆</div><h3>শীঘ্রই আসছে টুর্নামেন্ট!</h3><p>এখনো কোনো ম্যাচ খোলা হয়নি। নতুন ম্যাচ এলে এখানে টিমগুলো দেখা যাবে।</p><button class="b pri" data-l="telegram">টেলিগ্রামে যোগ দিন</button></div>`;
 const teams=RAW.teams.filter(t=>t.matchId===m.id);
 const opts=`<div class="opts">${RL.map(x=>`<button class="${x.id==S.rm?"on":""}" data-r="${x.id}">${x.title}</button>`).join("")}</div>`;
 const list=teams.length?teams.map((t,i)=>{const ps=mgPlayers(t),nm=escH(t.name||"টিম");
  return `<div class="tm-card"><div class="tm-h">${t.logo?`<img class="tm-lg" src="${t.logo}" alt="">`:`<div class="tm-lg">${nm[0]||"T"}</div>`}<div style="flex:1;min-width:0"><b>${nm}</b><br><small>${bn(ps.length)} জন প্লেয়ার</small></div><span class="mtag">#${bn(i+1)}</span></div>${ps.length?ps.map((p,j)=>`<div class="pr"><i>${bn(j+1)}</i><span>${escH(p.n||"প্লেয়ার")}</span>${p.u?`<em>UID ${escH(p.u)}</em>`:""}</div>`).join(""):'<div style="color:var(--mut);font-size:13px">প্লেয়ারের তথ্য শীঘ্রই যোগ হবে</div>'}</div>`}).join("")
  :`<div class="emp"><div class="em">🎮</div><h3>এখনো কোনো টিম নেই</h3><p>${escH(m.title)} ম্যাচে প্রথম টিম হয়ে যান! রেজিস্ট্রেশন করলে আপনার টিম লোগো ও প্লেয়ারদের নামসহ এখানে দেখা যাবে।</p><button class="b pri" data-l="telegram">জয়েন করতে মেসেজ দিন</button></div>`;
 return hero+opts+`<div style="padding:6px 18px 0;color:var(--mut);font-size:13px;font-weight:600">${escH(m.title)} · ${bn(teams.length)}/${bn(m.max)} টিম</div>`+list}
function myMatches(){
 const l=MATCHES.filter(isJoined);
 const hero=`<div class="pg-hero"><h2>🎮 আমার ম্যাচ</h2><p>${l.length?"আপনি যে ম্যাচগুলোতে খেলছেন":"আপনার খেলার তালিকা এখানে দেখা যাবে"}</p></div>`;
 if(l.length)return hero+`<div style="height:12px"></div>`+l.map(card).join("")+`<div style="padding:0 16px"><button class="b pri" style="width:100%" data-l="telegram">➕ আরও ম্যাচে জয়েন করুন</button></div>`;
 return hero+`<div class="emp"><div class="em">🔥</div><h3>এখনো কোনো ম্যাচে নেই</h3><p>বড় প্রাইজের টুর্নামেন্টে অংশ নিন! টেলিগ্রামে মেসেজ দিন, টাকা যাচাই হলে ফর্ম পাবেন, ফর্ম পূরণের পর আপনার ম্যাচ এখানে যোগ হবে।</p></div><div class="stk"><button class="b pri" data-l="telegram">🚀 জয়েন ম্যাচ</button></div>`}
</script>
<script>
function cdState(m){
 const n=m.teams||0;
 if(m.full||(m.max&&n>=m.max))return["🔴 ম্যাচ ফুল","full"];
 if(!m.startAt)return null;
 const d=m.startAt-Date.now();
 if(d<=0)return["🟢 জয়েনিং চলছে · "+bd2(Math.max(0,m.max-n))+"টি স্লট খালি",""];
 const s=Math.floor(d/1000),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),mi=Math.floor(s%3600/60),se=s%60;
 const t=dd?`${bd2(dd)}দিন ${bd2(h)}ঘ:${bd2(cdPad(mi))}মি`:(h?`${bd2(h)}ঘ:${bd2(cdPad(mi))}মি:${bd2(cdPad(se))}সে`:`${bd2(mi)}মি:${bd2(cdPad(se))}সে`);
 return["⏱ শুরু হতে বাকি - "+t,""]}
</script>
